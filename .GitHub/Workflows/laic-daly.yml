name: LAIC Daily Earthquake Monitor

on:
  schedule:
    # 06:00 UTC и 18:00 UTC каждый день
    - cron: '0 6 * * *'
    - cron: '0 18 * * *'
  
  # Ручной запуск для тестов
  workflow_dispatch:
    inputs:
      debug:
        description: 'Режим отладки'
        required: false
        default: 'false'

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      # КЭШ Python-зависимостей
      - name: 💾 Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      # КЭШ данных USGS (чтобы не качать одно и то же)
      - name: 💾 Cache earthquake data
        uses: actions/cache@v4
        with:
          path: data/cache
          key: usgs-data-${{ github.run_id }}
          restore-keys: |
            usgs-data-
      
      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 📁 Create directories
        run: |
          mkdir -p data/cache logs
      
      - name: 🚀 Run LAIC Analysis
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEBUG_MODE: ${{ github.event.inputs.debug || 'false' }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python main.py
      
      # Сохранение логов как артефакт
      - name: 💾 Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laic-logs-${{ github.run_id }}
          path: |
            logs/
            data/cache/
          retention-days: 7
      
      # Авто-коммит для "keep alive" (предотвращает отключение Actions)
      - name: 🔄 Keep repository active
        run: |
          git config --local user.email "laic-bot@github.actions"
          git config --local user.name "LAIC Bot"
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .last_run
          git add .last_run
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: keep alive [skip ci] $(date -u +%Y-%m-%d)"
          git push || echo "Nothing to push"
          
