# === ПАРАМЕТРЫ АНАЛИЗА ===
analysis:
  history_days: 30           # Сколько дней истории анализировать
  precursor_window_days: 7   # Окно для поиска предвестников
  swarm_detection_hours: 72  # Часы для обнаружения роя
  energy_window_days: 14    # Окно для расчёта энергии
  
  # Пороги индекса риска (0-100)
  risk_levels:
    low: 25
    moderate: 45
    high: 65
    critical: 80

  # Параметры для обнаружения аномалий
  anomaly:
    min_events_for_trend: 5
    trend_significance: 0.05
    magnitude_acceleration_threshold: 0.3

# === TELEGRAM ===
telegram:
  max_message_length: 4000
  alert_cooldown_hours: 6     # Не спамить алертами чаще

# === КЭШ ===
cache:
  enabled: true
  directory: "data/cache"
  max_age_hours: 6           # Кэш USGS данных
  
