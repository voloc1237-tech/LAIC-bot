name: Train Full Models (LSTM + RF)

on:
  workflow_dispatch:
    inputs:
      train_lstm:
        description: 'Обучить LSTM'
        required: true
        default: true
        type: boolean
      train_rf:
        description: 'Обучить RF'
        required: true
        default: true
        type: boolean

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install tensorflow scikit-learn pandas numpy

      - name: Train LSTM
        if: github.event.inputs.train_lstm == 'true'
        run: python scripts/train_full_lstm.py

      - name: Train RF
        if: github.event.inputs.train_rf == 'true'
        run: python scripts/train_full_rf.py

      - name: Upload models
        uses: actions/upload-artifact@v4
        with:
          name: full-models
          path: |
            models/lstm_full_model.keras
            models/lstm_full_scaler.pkl
            models/rf_full_model.pkl
            models/rf_full_scaler.pkl

      - name: Commit and push models
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/*.keras models/*.pkl || true
          git diff --cached --quiet || git commit -m "Update full models [skip ci]"
          git push || echo "Push failed, but artifact is saved"
