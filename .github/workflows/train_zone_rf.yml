name: Train Zone RandomForest Model

on:
  workflow_dispatch:   # запуск вручную

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install scikit-learn pandas numpy

      - name: Prepare zone data
        run: python scripts/prepare_zone_data.py

      - name: Train RandomForest model
        run: python scripts/train_zone_rf.py

      - name: Save region mapping
        run: |
          python -c "
import pickle
import pandas as pd
from pathlib import Path

df = pd.read_pickle('data/events_with_regions.pkl')
region_mapping = df[['region_id', 'region']].drop_duplicates().set_index('region_id').to_dict()['region']

with open('data/region_mapping.pkl', 'wb') as f:
    pickle.dump(region_mapping, f)

print(f'✅ region_mapping.pkl создан ({len(region_mapping)} регионов)')
"

      - name: Upload model
        uses: actions/upload-artifact@v4
        with:
          name: zone-rf-model
          path: |
            models/zone_rf_model.pkl
            models/scaler_rf.pkl
            models/feature_importance.pkl
            data/region_mapping.pkl

      - name: Commit and push model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/zone_rf_model.pkl models/scaler_rf.pkl models/feature_importance.pkl data/region_mapping.pkl || true
          git diff --cached --quiet || git commit -m "Update zone RF model and region mapping [skip ci]"
          git push || echo "Push failed"
