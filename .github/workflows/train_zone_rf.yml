name: Train Zone RandomForest Model

on:
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install scikit-learn pandas numpy

      - name: Prepare zone data
        run: python scripts/prepare_zone_data.py

      - name: Train RandomForest model
        run: python scripts/train_zone_rf.py

      - name: Create region mapping from GeoJSON
        run: python scripts/create_region_mapping.py

      - name: Upload model
        uses: actions/upload-artifact@v4
        with:
          name: zone-rf-model
          path: |
            models/zone_rf_model.pkl
            models/scaler_rf.pkl
            models/feature_importance.pkl
            data/region_mapping.pkl
            data/events_with_regions.pkl

      - name: Commit and push model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/zone_rf_model.pkl models/scaler_rf.pkl models/feature_importance.pkl data/region_mapping.pkl data/events_with_regions.pkl || true
          git diff --cached --quiet || git commit -m "Update zone RF model and region mapping [skip ci]"
          git push || echo "Push failed"
