name: LAIC Daily Monitor
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install earthengine-api google-auth

      # ===== ПОДГОТОВКА КЛЮЧА С ОЧИСТКОЙ И МИНИФИКАЦИЕЙ ЧЕРЕЗ PYTHON =====
      - name: Prepare Earth Engine key
        env:
          EARTH_ENGINE_KEY_BASE64: ${{ secrets.EARTH_ENGINE_KEY_BASE64 }}
        run: |
          # Удаляем все пробелы, табы, переводы строк и другие непечатаемые символы из base64
          CLEAN_BASE64=$(echo "$EARTH_ENGINE_KEY_BASE64" | tr -d '\n\r\t ' | sed 's/[^A-Za-z0-9+\/=]//g')
          
          # Декодируем base64 и минифицируем JSON с помощью Python (безопасно для управляющих символов)
          echo "$CLEAN_BASE64" | base64 -d | python3 -c "
          import sys, json
          try:
              data = json.load(sys.stdin)
              json.dump(data, sys.stdout, separators=(',', ':'))
          except Exception as e:
              print(f'Ошибка при обработке JSON: {e}', file=sys.stderr)
              sys.exit(1)
          " > /tmp/ee-key.json
          
          # Проверка результата
          echo "=== Первые 100 символов ключа ==="
          head -c 100 /tmp/ee-key.json
          echo ""
          echo "=== Размер файла (байт) ==="
          wc -c /tmp/ee-key.json
          echo "✅ Ключ сохранён в /tmp/ee-key.json"

      # ===== ОСНОВНОЙ ЗАПУСК =====
      - name: Run LAIC Analysis
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EARTH_ENGINE_KEY_PATH: /tmp/ee-key.json
          EARTH_ENGINE_PROJECT: ${{ secrets.EARTH_ENGINE_PROJECT }}
          # НЕ передаём EARTH_ENGINE_KEY_BASE64, чтобы код использовал путь
        run: python main.py
