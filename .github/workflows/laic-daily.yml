name: LAIC Daily Monitor

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install earthengine-api google-auth
          
      

      - name: 🔑 Setup Earth Engine
        env:
          EARTH_ENGINE_KEY_BASE64: ${{ secrets.EARTH_ENGINE_KEY_BASE64 }}
        run: |
          echo "$EARTH_ENGINE_KEY_BASE64" | base64 -d > /tmp/ee-key.json
          
          echo "=== Первые 100 символов ключа ==="
          head -c 100 /tmp/ee-key.json
          echo ""
          echo "=== Длина файла ==="
          wc -c /tmp/ee-key.json
          echo "✅ EE ключ готов"
          
          
      - name: 🚀 Run LAIC Analysis
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EARTH_ENGINE_KEY_PATH: /tmp/ee-key.json
          EARTH_ENGINE_PROJECT: ${{ secrets.EARTH_ENGINE_PROJECT }}
        run: python main.py
