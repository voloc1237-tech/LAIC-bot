name: LAIC Daily Monitor
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install earthengine-api google-auth

      # ========== ОТЛАДОЧНЫЙ ШАГ (можно удалить после проверки) ==========
      - name: Debug EARTH_ENGINE_KEY_BASE64
        env:
          EARTH_ENGINE_KEY_BASE64: ${{ secrets.EARTH_ENGINE_KEY_BASE64 }}
        run: |
          echo "=== ОТЛАДКА СЕКРЕТА ==="
          echo "Длина строки (в символах): ${#EARTH_ENGINE_KEY_BASE64}"
          echo "Первые 50 символов: ${EARTH_ENGINE_KEY_BASE64:0:50}"
          echo "Последние 10 символов: ${EARTH_ENGINE_KEY_BASE64: -10}"
          echo "Содержит перевод строки (\\n)?"
          if echo "$EARTH_ENGINE_KEY_BASE64" | grep -q $'\n'; then echo "⚠️ ДА — есть переносы!"; else echo "✅ НЕТ"; fi
          echo "Содержит пробелы?"
          if echo "$EARTH_ENGINE_KEY_BASE64" | grep -q ' '; then echo "⚠️ ДА — есть пробелы!"; else echo "✅ НЕТ"; fi
          echo "=========================="

      # ========== ОСНОВНОЙ ЗАПУСК ==========
      - name: Run LAIC Analysis
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EARTH_ENGINE_KEY_BASE64: ${{ secrets.EARTH_ENGINE_KEY_BASE64 }}
          EARTH_ENGINE_PROJECT: ${{ secrets.EARTH_ENGINE_PROJECT }}
        run: python main.py
