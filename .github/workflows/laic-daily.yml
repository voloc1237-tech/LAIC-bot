name: LAIC Daily Monitor
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install quakeion 
          pip install earthengine-api google-auth
          pip install tec==0.0.19
          pip install gnssanalysis==0.0.59 numpy pandas
          pip install tensorflow scikit-learn joblib
      # ===== ПОДГОТОВКА КЛЮЧА (МИНИФИКАЦИЯ JSON) =====
      - name: Prepare Earth Engine key
        env:
          EARTH_ENGINE_KEY_BASE64: ${{ secrets.EARTH_ENGINE_KEY_BASE64 }}
        run: |
          # Декодируем base64, загружаем JSON и выводим компактно (без пробелов и переносов)
          echo "$EARTH_ENGINE_KEY_BASE64" | base64 -d | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          json.dump(data, sys.stdout, separators=(',', ':'))
          " > /tmp/ee-key.json

          # Проверка (для отладки)
          echo "=== Первые 100 символов ==="
          head -c 100 /tmp/ee-key.json
          echo ""
          echo "=== Размер файла (байт) ==="
          wc -c /tmp/ee-key.json
          echo "✅ Ключ сохранён в /tmp/ee-key.json"

      # ===== ОСНОВНОЙ ЗАПУСК =====
      - name: Run LAIC Analysis
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EARTH_ENGINE_KEY_PATH: /tmp/ee-key.json          # оставляем путь
          EARTH_ENGINE_KEY_BASE64: ${{ secrets.EARTH_ENGINE_KEY_BASE64 }}   # ДОБАВЛЯЕМ!
          EARTH_ENGINE_PROJECT: ${{ secrets.EARTH_ENGINE_PROJECT }}
        run: python main.py
