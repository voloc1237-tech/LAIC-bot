name: LAIC Daily Monitor
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 1. САМОЕ ВАЖНОЕ: Установка системных зависимостей для GDAL/gnssanalysis
      - name: Install System Dependencies (GDAL, etc.)
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev python3-gdal libgeos-dev libproj-dev
          echo "✅ Системные библиотеки GDAL установлены"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 2. Установка Python зависимостей
      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          # Сначала ставим тяжелые системные пакеты, потом остальное
          pip install -r requirements.txt
          
          # Остальные специфические пакеты
          pip install quakeion earthengine-api google-auth tec==0.0.19
          pip install numpy pandas tensorflow scikit-learn joblib
          
          # Установка gnssanalysis (теперь она сработает, так как GDAL уже есть)
          echo "=== Установка gnssanalysis ==="
          pip install gnssanalysis==0.0.57
          
          # Проверка импорта прямо здесь, чтобы увидеть ошибку сразу, если что
          python -c "import gnssanalysis; print('✅ gnssanalysis успешно импортирована!')"

      # ===== ПОДГОТОВКА КЛЮЧА EARTH ENGINE =====
      - name: Prepare Earth Engine key
        env:
          EARTH_ENGINE_KEY_BASE64: ${{ secrets.EARTH_ENGINE_KEY_BASE64 }}
        run: |
          echo "$EARTH_ENGINE_KEY_BASE64" | base64 -d > /tmp/ee-key.json
          wc -c /tmp/ee-key.json
          echo "✅ Ключ сохранён в /tmp/ee-key.json"

      # ===== ОСНОВНОЙ ЗАПУСК С ФЛАГОМ ОТЛАДКИ =====
      # Мы передаем переменную окружения TEST_MODE=true, чтобы main.py принудительно взял дату 2023 года
      - name: Run LAIC Analysis
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EARTH_ENGINE_KEY_PATH: /tmp/ee-key.json
          EARTH_ENGINE_PROJECT: ${{ secrets.EARTH_ENGINE_PROJECT }}
          
          # 👇 КРИТИЧЕСКИ ВАЖНО: Включаем тестовый режим для скачивания реальных файлов IONEX
          TEST_MODE: "true"
          
        run: python main.py
