- name: Test Swarm connection
    env:
        VIRES_ACCESS_TOKEN: ${{ secrets.VIRES_ACCESS_TOKEN }}
        run: |
          python - <<'EOF'
          import os
          from datetime import datetime, timedelta, timezone
          from viresclient import SwarmRequest

          print("🔍 Тест Swarm...")
          
          token = os.environ.get("VIRES_ACCESS_TOKEN", "").strip()
          if not token:
              print("❌ Токен не найден или пуст в окружении")
              exit(1)

          print(f"✅ Токен получен. Длина: {len(token)} символов. Начало: {token[:10]}...")

          # 1. ПРЯМАЯ передача URL и токена в конструктор (гарантированно работает в CI, обходя ~/.viresclient.ini)
          url = "https://vires.services/ows"
          print(f"🔗 Инициализация запроса к {url}...")
          request = SwarmRequest(url=url, token=token)

          # 2. ШАГ ДИАГНОСТИКИ: Проверяем базовый доступ к списку коллекций
          print("📡 Проверка базового доступа (available_collections)...")
          try:
              collections = request.available_collections()
              print(f"✅ Базовый доступ подтвержден! Доступно коллекций: {len(collections)}")
          except Exception as e:
              print(f"❌ КРИТИЧЕСКАЯ ОШИБКА: Токен недействителен или отозван. Детали: {e}")
              exit(1)

          # 3. Основной запрос данных
          request.set_collection("SW_OPER_MAGA_LR_1B")
          request.set_products(
              measurements=["F"],
              models=["CHAOS-Core"],
              auxiliaries=["QDLat", "QDLon"],
              sampling_step="PT10S"
          )

          end = datetime.now(timezone.utc)
          start = end - timedelta(days=3)

          print(f"📅 Запрос данных: {start.date()} — {end.date()}")
          try:
              data = request.get_between(start, end)
              df = data.as_dataframe()
              print(f"✅ Получено {len(df)} записей")
              print("🎉 Тест успешно пройден!")
          except Exception as e:
              print(f"❌ Ошибка при получении данных: {e}")
              print("💡 Возможные причины: у токена нет прав на 'SW_OPER_MAGA_LR_1B', или запрос превышает лимиты.")
              exit(1)
          EOF
