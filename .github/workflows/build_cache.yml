name: Build Cache 2024

on:
  workflow_dispatch:   # запуск вручную из интерфейса GitHub

jobs:
  build-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 6 часов (максимум для бесплатных)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install earthengine-api google-auth

      - name: Prepare Earth Engine key
        env:
          EARTH_ENGINE_KEY_BASE64: ${{ secrets.EARTH_ENGINE_KEY_BASE64 }}
        run: |
          echo "$EARTH_ENGINE_KEY_BASE64" | base64 -d > /tmp/ee-key.json
          echo "✅ EE key ready"

      - name: Run collection script
        env:
          EARTH_ENGINE_KEY_PATH: /tmp/ee-key.json
          EARTH_ENGINE_PROJECT: ${{ secrets.EARTH_ENGINE_PROJECT }}
          # Если нужны другие переменные, добавьте их сюда
        run: |
          python collect_cache_data.py

      - name: Upload cache as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cache-data
          path: data/cache_*.json  # ← захватит все JSON-файлы
     # - name: Upload cache as artifact
       # uses: actions/upload-artifact@v4
       # with:
          #name: cache-2024
          #path: |
           # data/cache_2024.json
           # data/cache_2024.pkl

      - name: Commit and push to repo (опционально)
        if: always()  # даже если были ошибки, попробуем закоммитить то, что есть
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cache_2024.* || true
          git diff --cached --quiet || git commit -m "Update cache 2024 [skip ci]"
          git push || echo "Push failed, but artifact is saved"
